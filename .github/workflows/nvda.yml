# Verificación con NVDA real, sobre Windows.
#
# Por qué existe: el puente de lector del motor se verificaba solo con
# VoiceOver, porque el equipo trabaja en macOS. Pero en España el lector
# dominante es NVDA, y NVDA es Windows. Un runner `windows-latest` es la forma
# realista de ejecutarlo sin tener una máquina Windows delante.
#
# Por qué vive AQUÍ y no en agente-a11y-motor/.github/: GitHub Actions solo lee
# los workflows de la raíz del repositorio. Un .github anidado en una subcarpeta
# no se ejecuta nunca — el fichero parece estar y no corre. Por eso los pasos
# trabajan dentro de `agente-a11y-motor`.
#
# Qué hace: instala NVDA con `@guidepup/setup`, recorre un componente de prueba
# con el lector de verdad, y guarda el JSON con la transcripción literal. Ese
# JSON es el entregable: se baja como artefacto y se guarda en
# `agente-a11y-motor/test/fixtures/nvda-es-real.json` con
# `node scripts/fixture-nvda.mjs`, y a partir de ahí la comparación se puede
# probar en cualquier máquina, sin Windows y sin lector.
#
# La ejecución NO se lanza sola en cada push: arrancar un lector de pantalla es
# lento y frágil, y un fallo suyo no debería teñir de rojo un cambio de CSV. Se
# lanza a mano (`workflow_dispatch`) y una vez por semana.
name: NVDA (Windows)

on:
  workflow_dispatch:
  schedule:
    # Lunes a las 06:00 UTC. Semanal: el objetivo es detectar que una versión
    # nueva de NVDA cambia lo que anuncia, y eso no pasa todos los días.
    - cron: "0 6 * * 1"

defaults:
  run:
    working-directory: agente-a11y-motor

jobs:
  nvda:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      - name: Dónde estamos
        # Una línea que ahorra media hora cuando algo falla: qué Node hay, qué
        # shell ejecuta los scripts y dónde está plantado el paso.
        run: node -v && npm -v && node -p "process.platform + ' ' + process.cwd()"

      - name: Las pruebas puras primero
        # Si el motor está roto, no tiene sentido arrancar un lector: el fallo
        # se vería como «NVDA no confirma» cuando el problema es otro.
        run: npm test

      - name: Instalar NVDA
        # `setup` NO instala nada en Windows: en el código del propio CLI, el
        # caso `win32` está vacío y sale diciendo «Environment setup complete».
        # Quien descarga NVDA y lo registra para Guidepup es `install`, y por eso
        # el run anterior murió con «NVDA not supported» después de un `setup`
        # que había terminado en verde.
        #
        # Se ejecuta desde `agente-a11y-motor` porque el CLI busca
        # `@guidepup/guidepup` a partir del directorio actual: de ahí saca el
        # manifiesto con los lectores disponibles.
        run: npx --yes @guidepup/setup install

      - name: Verificar con NVDA
        shell: pwsh
        env:
          NVDA_NAVEGADOR: chrome
          NVDA_PASOS: "16"
        # LA SALIDA SE GUARDA EN UN FICHERO, y no es por gusto: la ejecución
        # anterior dejó esto y nada más —
        #
        #   nvda  Process completed with exit code 1.
        #   nvda  No files were found with the provided path: …verificacion-nvda.json.
        #
        # El motivo lo decía el script por la salida de error, pero el log de un
        # runner se mira una vez y se cierra, mientras el artefacto es lo que
        # queda. Con `*>` se captura todo —stdout y stderr, incluidas las líneas
        # «(ventanas …)» que dicen qué había en primer plano—, se imprime igual
        # en el log, y se preserva el código de salida para que el paso siga
        # fallando cuando falla.
        run: |
          node examples/verificar-nvda.mjs verificacion-nvda.json *> nvda-salida.log
          $codigo = $LASTEXITCODE
          Get-Content nvda-salida.log
          exit $codigo

      - name: Resumen en el log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path verificacion-nvda.json) {
            $j = Get-Content verificacion-nvda.json -Raw | ConvertFrom-Json
            # El informe puede ser de ÉXITO o de FALLO: desde v0.84.0 el script
            # deja JSON en las dos salidas, porque un artefacto que falta se lee
            # como «no pasó nada» cuando lo que pasó es que no se pudo comprobar.
            if ($j.ok -eq $false) {
              Write-Host "NO VERIFICADO: $($j.motivo)"
              if ($j.pila) { $j.pila | ForEach-Object { Write-Host "    $_" } }
            } else {
              Write-Host "Resumen: $($j.resumen | ConvertTo-Json -Compress)"
              foreach ($r in $j.resultados) { Write-Host "  $($r.veredicto)  $($r.locator)  <- $($r.fraseLimpia)" }
            }
          } else {
            Write-Host "No se generó el informe NI el informe del fallo: el proceso murió antes de llegar al script."
          }

      - name: Guardar la transcripción y el log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verificacion-nvda
          path: |
            agente-a11y-motor/verificacion-nvda.json
            agente-a11y-motor/nvda-salida.log
          # `error` y no `warn`: desde v0.84.0 el script deja informe también
          # cuando falla, así que si aquí no hay nada es que ni eso se pudo, y
          # eso tiene que teñir el paso en vez de pasar como un aviso.
          if-no-files-found: error
