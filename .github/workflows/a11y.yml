name: ♿ Auditoría de Accesibilidad – IAAP PRO

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "URL raíz del sitio a auditar (https://dominio.com)"
        required: true
        default: "https://www.suntransfers.com"
  push:
    branches: [ main, master ]
  pull_request:

env:
  NODE_VERSION: "20"
  SITE_URL: ${{ github.event.inputs.site_url || vars.SITE_URL || 'https://www.suntransfers.com' }}
  LANG_FILTER: "/es/"
  TZ: Europe/Madrid
  LANG: es_ES.UTF-8

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 🔍 Verificar disponibilidad de ${{ env.SITE_URL }}
        run: |
          echo "🔎 Comprobando que $SITE_URL responde con 200 OK…"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
          if [ "$STATUS" != "200" ]; then
            echo "❌ El sitio respondió con HTTP $STATUS"
            exit 1
          fi
          echo "✅ Sitio accesible (HTTP 200)."

      - name: 📦 Instalar dependencias
        run: |
          npm ci
          npx cypress verify || true

      - name: 🗂️ Preparar directorios IAAP
        run: |
          rm -rf auditorias public || true
          mkdir -p auditorias/{capturas,auditoria-sitemap,auditoria-interactiva,reportes} public/auditorias

      - name: 🌍 Crawler general IAAP
        env:
          SITE_URL: ${{ env.SITE_URL }}
        run: |
          node scripts/crawl.mjs

      - name: 📑 Sitemap → RAW
        env:
          SITE_URL: ${{ env.SITE_URL }}
        run: node crawler/sitemap-crawler.mjs

      - name: 🧹 Normalizar Sitemap
        run: node crawler/sitemap-normalizer.mjs

      - name: 🧠 IAAP Interactive Crawler
        run: node crawler/interactive-crawler.mjs

      - name: ♿ Auditoría AXE – Sitemap
        env:
          SITE_URL: ${{ env.SITE_URL }}
        run: |
          npx cypress run \
            --browser chrome \
            --headless \
            --config-file cypress.config.mjs \
            --spec cypress/e2e/audit-sitemap.cy.js

      - name: ♿ Auditoría AXE – Interactiva
        env:
          SITE_URL: ${{ env.SITE_URL }}
        run: |
          npx cypress run \
            --browser chrome \
            --headless \
            --config-file cypress.config.mjs \
            --spec cypress/e2e/audit-interactive.cy.js

      - name: 📸 Evidencias IAAP – Sitemap
        env:
          AUDIT_MODE: sitemap
        run: |
          npx cypress run \
            --browser chrome \
            --headless \
            --config-file cypress.config.mjs \
            --spec cypress/e2e/accessibility.cy.js

      - name: 📸 Evidencias IAAP – Interactiva
        env:
          AUDIT_MODE: interactiva
        run: |
          npx cypress run \
            --browser chrome \
            --headless \
            --config-file cypress.config.mjs \
            --spec cypress/e2e/accessibility.cy.js

      - name: ♻️ Merge IAAP PRO
        run: npm run merge

      - name: 🧾 Generar resumen ejecutivo
        run: npm run summary

      - name: 📊 Exportar CSV
        run: npm run export:csv

      - name: 📊 Exportar XLSX
        run: npm run export:xlsx

      - name: 📄 Exportar PDF
        run: npm run export:pdf || echo "⚠️ Exportación PDF falló (revisar entorno Chrome)"

      - name: 📦 Comprimir resultados
        if: always()
        run: |
          ZIP="auditorias/IAAP-${{ github.run_number }}.zip"
          zip -r "$ZIP" auditorias || true
          echo "ZIP_PATH=$ZIP" >> $GITHUB_ENV

      - name: 📤 Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "iaap-auditoria-${{ github.run_number }}"
          path: |
            ${{ env.ZIP_PATH }}
            auditorias/**/*.json
            auditorias/**/*.png
          retention-days: 21
